<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage users — GST Review Checklist</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%85</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Manage users</h1>
    <div class="crumbs"><a href="/index.html">&larr; All entities</a></div>
  </header>

  <main>
    <div class="toolbar">
      <div class="spacer"></div>
      <button id="addUserBtn">+ Add manager</button>
    </div>

    <div id="userList" class="review-list"></div>
    <div id="emptyState" class="empty-state hidden">
      <p>No manager accounts yet. Add one to start assigning entities to them.</p>
    </div>
  </main>

  <dialog id="userDialog">
    <form class="modal-body" id="userForm">
      <h2 id="userDialogTitle">Add manager</h2>
      <div class="field">
        <label for="userUsername">Username</label>
        <input type="text" id="userUsername" required maxlength="40" autocomplete="off" />
        <div class="hint">Letters, numbers, dots, dashes and underscores only.</div>
      </div>
      <div class="field">
        <label for="userName">Full name</label>
        <input type="text" id="userName" required maxlength="100" autocomplete="off" />
      </div>
      <div class="field">
        <label for="userPassword" id="userPasswordLabel">Password</label>
        <input type="password" id="userPassword" maxlength="100" autocomplete="new-password" />
        <div class="hint" id="userPasswordHint">At least 6 characters.</div>
      </div>
      <div class="error-text hidden" id="userFormError"></div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="userCancelBtn">Cancel</button>
        <button type="submit" id="userSaveBtn">Save</button>
      </div>
    </form>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/auth-header.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
