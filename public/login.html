<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — GST Review Checklist</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%85</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="login-page">
    <form class="card login-card" id="loginForm">
      <h1>GST Review Checklist</h1>
      <p class="hint">Sign in to continue.</p>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username" autofocus />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <div class="error-text hidden" id="loginError"></div>
      <button type="submit" id="loginBtn">Log in</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
